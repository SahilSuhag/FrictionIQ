<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FrictionIQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#home" aria-label="FrictionIQ home">
      <span class="logo" aria-hidden="true">F</span>
      <span class="brand-name">FrictionIQ</span>
    </a>
    <span class="tag tag-info">Synthetic data</span>
    <nav class="nav" aria-label="Main">
      <a href="#home" data-nav="home" aria-label="Home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      </a>
      <a href="#client" data-nav="client">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18.5c1.4-2.2 3.3-3.3 5.5-3.3s4.1 1.1 5.5 3.3"/></svg>
        <span class="lbl">Clients</span>
      </a>
      <a href="#rule" data-nav="rule">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
        <span class="lbl">Rule tradeoffs</span>
      </a>
    </nav>
    <div class="topbar-right">
      <div class="search">
        <button id="search-toggle" class="icon-btn" aria-label="Search clients" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        </button>
        <div id="search-pop" class="search-pop" hidden>
          <label for="search-input" class="visually-hidden">Find a client</label>
          <input id="search-input" list="client-options" placeholder="Find a client by name or ID" autocomplete="off">
          <datalist id="client-options"></datalist>
        </div>
      </div>
      <div class="viewer">
        <div class="viewer-name" id="viewer-name"></div>
        <div class="viewer-role" id="viewer-role"></div>
      </div>
      <span class="avatar" id="viewer-avatar" aria-hidden="true"></span>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>

  <script src="data/frictioniq.js"></script>
  <script src="app.js"></script>
</body>
</html>
